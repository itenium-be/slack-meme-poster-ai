worker_processes 1;
events { worker_connections 256; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # Tight access log to one line so `docker logs` is useful but not noisy.
    log_format slim '$remote_addr "$request" $status $body_bytes_sent';
    access_log /dev/stdout slim;
    error_log  /dev/stderr warn;

    server {
        listen 80 default_server;

        # Only the already-sent directory is served; the unsent memes folder
        # stays private. The poster moves a file into here just before posting,
        # so Slack's fetcher gets a 200.
        root /srv/memes/already-sent;

        # No directory listings — a casual visitor shouldn't enumerate every
        # meme you've ever sent.
        autoindex off;

        # Slack fetches the image once and caches it on their CDN; long max-age
        # is fine because filenames don't get reused (file moves, doesn't copy).
        location / {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Trivial healthcheck for docker-compose.
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }
    }
}
