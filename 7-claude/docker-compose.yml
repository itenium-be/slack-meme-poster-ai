services:
  poster:
    build: ./poster
    container_name: slack-meme-poster
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Brussels}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      PUBLIC_MEMES_URL: ${PUBLIC_MEMES_URL}
      MEMES_DIR: /memes
    volumes:
      - ./memes:/memes
    depends_on:
      - nginx

  nginx:
    image: nginx:1.27-alpine
    container_name: slack-meme-nginx
    restart: unless-stopped
    ports:
      # Exposed on all interfaces so the ISP router's 4001 -> 4001 forward
      # reaches the container. Same port on both sides to match the existing
      # router rule for itenium-test.synology.me:4001.
      - "4001:4001"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./memes:/srv/memes:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:4001/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
